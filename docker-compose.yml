# Databases for `npm run test:integration`. Start them all with
#   docker compose up -d --wait
# or a single one with `docker compose up -d --wait postgres`.
# Connection strings (also set in .github/workflows/ci.yml):
#   KASTOR_PG_URL=postgres://kastor:kastor@localhost:54329/kastor
#   KASTOR_COCKROACH_URL=postgres://root@localhost:26259/defaultdb?sslmode=disable
#   KASTOR_MYSQL_URL=mysql://root:kastor@localhost:33069/kastor
#   KASTOR_MARIADB_URL=mysql://root:kastor@localhost:33079/kastor
#   KASTOR_MSSQL_URL=mssql://sa:Kastor_pass1@localhost:14339/master
#   KASTOR_ORACLE_URL=oracle://kastor:kastor@localhost:15219/FREEPDB1
#   KASTOR_MONGO_URL=mongodb://localhost:27019/kastor?replicaSet=rs0&directConnection=true
name: kastor

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: kastor
      POSTGRES_PASSWORD: kastor
      POSTGRES_DB: kastor
    ports:
      - "54329:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kastor -d kastor -h 127.0.0.1"]
      interval: 2s
      timeout: 5s
      retries: 60

  cockroach:
    image: cockroachdb/cockroach:v24.2.4
    command: start-single-node --insecure
    ports:
      - "26259:26257"
    healthcheck:
      test: ["CMD", "cockroach", "sql", "--insecure", "--host=localhost:26257", "-e", "select 1"]
      interval: 3s
      timeout: 10s
      retries: 60

  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: kastor
      MYSQL_DATABASE: kastor
    ports:
      - "33069:3306"
    healthcheck:
      # TCP only: the temporary init server listens on the socket alone, so
      # this turns healthy once the real server is up.
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-pkastor"]
      interval: 3s
      timeout: 5s
      retries: 80

  mariadb:
    image: mariadb:11.4
    environment:
      MARIADB_ROOT_PASSWORD: kastor
      MARIADB_DATABASE: kastor
    ports:
      - "33079:3306"
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 3s
      timeout: 5s
      retries: 80

  mssql:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: Kastor_pass1
      MSSQL_PID: Developer
    ports:
      - "14339:1433"
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P Kastor_pass1 -C -b -Q 'SELECT 1' || exit 1"]
      interval: 5s
      timeout: 10s
      retries: 60
      start_period: 20s

  oracle:
    image: gvenzl/oracle-free:23-slim-faststart
    environment:
      ORACLE_PASSWORD: kastor
      APP_USER: kastor
      APP_USER_PASSWORD: kastor
    ports:
      - "15219:1521"
    healthcheck:
      test: ["CMD", "healthcheck.sh"]
      interval: 5s
      timeout: 10s
      retries: 100
      start_period: 20s

  mongo:
    image: mongo:7
    command: ["--replSet", "rs0", "--bind_ip_all", "--port", "27019"]
    ports:
      - "27019:27019"
    healthcheck:
      # Initiates the single node replica set on first run (transactions need
      # one) and reports healthy once this node is the writable primary.
      test:
        - CMD
        - mongosh
        - --port
        - "27019"
        - --quiet
        - --eval
        - "try { rs.status() } catch (e) { rs.initiate({ _id: 'rs0', members: [{ _id: 0, host: 'localhost:27019' }] }) } if (!db.hello().isWritablePrimary) quit(1)"
      interval: 2s
      timeout: 10s
      retries: 60
      start_period: 5s
